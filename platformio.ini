[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = front, rear, motors

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags = -std=gnu++14 -Wall -Wextra

[env:front]
board = esp32cam
build_flags = ${env.build_flags} -DROBOT_CAMERA=1 -DROBOT_MOTORS=0 -DROBOT_FRONT=1

[env:rear]
board = esp32cam
build_flags = ${env.build_flags} -DROBOT_CAMERA=1 -DROBOT_MOTORS=0 -DROBOT_FRONT=0

[env:motors]
board = nodemcu-32s
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -DROBOT_CAMERA=0 -DROBOT_MOTORS=1
