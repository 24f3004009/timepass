name: Robot checks

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python protocol and camera integration tests
        run: python -m unittest discover -s tests -v
      - name: Native motor safety tests
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -Ifirmware/include tests/test_drive.cpp -o /tmp/robot-drive-tests
          /tmp/robot-drive-tests
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [front, rear, motors]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pio run -e ${{ matrix.target }}
